<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kwikar — You're Offline</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Plus Jakarta Sans',sans-serif;background:linear-gradient(135deg,#0a1a6e,#1849d6);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;color:#fff}
  .card{background:rgba(255,255,255,.1);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.2);border-radius:28px;padding:48px 40px;text-align:center;max-width:400px;width:100%}
  .icon{font-size:4rem;margin-bottom:24px;animation:float 3s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
  h1{font-size:1.7rem;font-weight:800;margin-bottom:12px;letter-spacing:-.5px}
  p{color:rgba(255,255,255,.75);font-size:.9rem;line-height:1.7;margin-bottom:28px}
  .logo{font-size:1.4rem;font-weight:800;margin-bottom:32px}
  .logo em{color:#f59e0b;font-style:normal}
  .btn{display:inline-block;background:#fff;color:#1849d6;font-family:inherit;font-size:.9rem;font-weight:800;padding:13px 28px;border-radius:50px;text-decoration:none;border:none;cursor:pointer;transition:all .25s}
  .btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.2)}
  .dot{display:inline-block;width:8px;height:8px;background:#ef4444;border-radius:50%;margin-right:8px;animation:blink 1.5s infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
  .status{font-size:.75rem;color:rgba(255,255,255,.5);margin-top:20px;display:flex;align-items:center;justify-content:center;gap:4px}
</style>
</head>
<body>
  <div class="card">
    <div class="logo">Kw<em>i</em>kar</div>
    <div class="icon">📡</div>
    <h1>You're Offline</h1>
    <p>Looks like you lost your internet connection. Check your Wi-Fi or mobile data and try again.</p>
    <button class="btn" onclick="location.reload()">Try Again →</button>
    <div class="status"><span class="dot"></span>Waiting for connection…</div>
  </div>
  <script>
    window.addEventListener('online', () => location.reload());
  </script>
</body>
</html>
