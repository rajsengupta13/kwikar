<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kwikar — Super Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #07080D; --surface: #0D0E16; --surface2: #111218;
      --card: rgba(255,255,255,0.038); --card-h: rgba(255,255,255,0.065);
      --border: rgba(255,255,255,0.08); --border-s: rgba(255,255,255,0.05);
      --sidebar-bg: #0A0B12; --topbar-bg: rgba(10,11,18,0.88);
      --text: #E5E7F0; --text2: #8B8FA8; --text3: #44475A;
      --cyan: #22D3EE; --purple: #A78BFA; --green: #34D399;
      --amber: #FBBF24; --red: #F87171; --pink: #F472B6;
      --cyan-d: rgba(34,211,238,0.14); --purple-d: rgba(167,139,250,0.14);
      --green-d: rgba(52,211,153,0.14); --amber-d: rgba(251,191,36,0.14);
      --red-d: rgba(248,113,113,0.14); --pink-d: rgba(244,114,182,0.14);
      --sw: 252px; --th: 58px;
      --r: 10px; --rs: 6px; --rl: 16px;
    }
    html, body { height: 100%; overflow: hidden; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }
    #root { height: 100vh; width: 100vw; display: flex; overflow: hidden; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    ::selection { background: rgba(34,211,238,0.22); }

    .kcard { background: var(--card); border: 1px solid var(--border); border-radius: var(--r); }
    .kcard-h:hover { background: var(--card-h); }
    .kbadge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; letter-spacing: .02em; }
    .kbtn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border: 1px solid var(--border); border-radius: var(--rs); background: var(--card); color: var(--text2); font-family: inherit; font-size: 12.5px; font-weight: 500; cursor: pointer; transition: all .15s; white-space: nowrap; }
    .kbtn:hover { background: var(--card-h); color: var(--text); border-color: rgba(255,255,255,0.14); }
    .kbtn.p { background: var(--cyan-d); border-color: rgba(34,211,238,.28); color: var(--cyan); }
    .kbtn.p:hover { background: rgba(34,211,238,.22); }
    .kbtn.d { background: var(--red-d); border-color: rgba(248,113,113,.28); color: var(--red); }
    .kbtn.pu { background: var(--purple-d); border-color: rgba(167,139,250,.28); color: var(--purple); }
    .kinput { background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: var(--rs); color: var(--text); font-family: inherit; font-size: 13px; padding: 7px 12px; outline: none; transition: border-color .15s; width: 100%; }
    .kinput:focus { border-color: var(--cyan); background: rgba(34,211,238,.04); }
    .kinput::placeholder { color: var(--text3); }
    .ktable { width: 100%; border-collapse: collapse; }
    .ktable th { text-align: left; font-size: 11px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--text3); padding: 10px 14px; border-bottom: 1px solid var(--border-s); }
    .ktable td { padding: 12px 14px; font-size: 13px; color: var(--text2); border-bottom: 1px solid var(--border-s); vertical-align: middle; }
    .ktable tr:last-child td { border-bottom: none; }
    .ktable tbody tr { transition: background .1s; cursor: pointer; }
    .ktable tbody tr:hover td { background: rgba(255,255,255,0.03); }
    .page-wrap { height: calc(100vh - var(--th)); overflow-y: auto; padding: 24px; }
    .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
    .page-title { font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 600; color: var(--text); }
    .page-sub { font-size: 13px; color: var(--text2); margin-top: 2px; }
    .section-label { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--text3); margin-bottom: 12px; }

    @keyframes fadeUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
    @keyframes slideLeft { from { opacity:0; transform:translateX(-12px); } to { opacity:1; transform:translateX(0); } }
    @keyframes pulse { 0%,100% { opacity:.6; } 50% { opacity:1; } }
    @keyframes ripple { 0% { transform:scale(.8); opacity:.8; } 100% { transform:scale(2.2); opacity:0; } }
    @keyframes shimmer { 0% { opacity:.5; } 50% { opacity:1; } 100% { opacity:.5; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    .fade-up { animation: fadeUp .35s ease both; }
    .slide-left { animation: slideLeft .25s ease both; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="kwikar-data.jsx"></script>
  <script type="text/babel" src="kwikar-shell.jsx"></script>
  <script type="text/babel" src="kwikar-dashboard.jsx"></script>
  <script type="text/babel" src="kwikar-live.jsx"></script>
  <script type="text/babel" src="kwikar-users.jsx"></script>
  <script type="text/babel" src="kwikar-abd.jsx"></script>
  <script type="text/babel" src="kwikar-tree.jsx"></script>
  <script type="text/babel" src="kwikar-finance.jsx"></script>
  <script type="text/babel" src="kwikar-ops.jsx"></script>
  <script type="text/babel" src="kwikar-reviews.jsx"></script>
  <script type="text/babel">
    const _root = ReactDOM.createRoot(document.getElementById('root'));
    _root.render(React.createElement(KwikarApp, null));
  </script>
</body>
</html>
