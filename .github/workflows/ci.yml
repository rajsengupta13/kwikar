name: CI

# Runs on every push (so feature branches get fast feedback) and on
# any pull request targeting develop or production — this is the
# gate that must pass before a develop → production PR can be merged.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [develop, production]

jobs:
  php-lint:
    name: PHP syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo, pdo_mysql, mysqli

      - name: Lint all PHP files (php -l)
        run: |
          set -e
          status=0
          while IFS= read -r -d '' file; do
            php -l "$file" || status=1
          done < <(find . -path ./vendor -prune -o -path ./node_modules -prune -o -name "*.php" -print0)
          exit $status

      - name: Verify .env.example is present and .env is not committed
        run: |
          test -f .env.example || (echo "::error::.env.example is missing" && exit 1)
          if git ls-files --error-unmatch .env > /dev/null 2>&1; then
            echo "::error::.env must not be committed to the repository"
            exit 1
          fi
          echo "Environment file hygiene OK"

  docker-build:
    name: Docker image build check
    runs-on: ubuntu-latest
    needs: php-lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push — build-only sanity check)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: kwikar-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
