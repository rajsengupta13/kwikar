name: CD — Deploy to Hostinger (SSH)

on:
  pull_request:
    types: [closed]
    branches: [production]
  workflow_dispatch: {}

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Rsync over SSH to Hostinger
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.base.ref == 'production' &&
       github.event.pull_request.head.ref == 'develop')
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || 'production' }}

      - name: Lint PHP on the exact commit being shipped (final safety net — full CI already ran on the PR)
        run: |
          set -e
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . -path ./vendor -prune -o -path ./node_modules -prune -o -name "*.php" -print0)

      - name: Write production .env and extract Hostinger config
        run: |
          if [ -z "${{ secrets.PRODUCTION_ENV_FILE }}" ]; then
            echo "::error::PRODUCTION_ENV_FILE secret is not set — see workflow header for setup"
            exit 1
          fi
          printf '%s\n' "${{ secrets.PRODUCTION_ENV_FILE }}" > .deploy.env

          for key in HOSTINGER_HOST HOSTINGER_PORT HOSTINGER_USER HOSTINGER_PATH; do
            value="$(sed -n "s/^$key=//p" .deploy.env | tail -n 1)"
            if [ -z "$value" ]; then
              echo "::error::Missing $key in PRODUCTION_ENV_FILE"
              exit 1
            fi
            echo "$key=$value" >> "$GITHUB_ENV"
          done

          grep -vE '^(HOSTINGER_HOST|HOSTINGER_PORT|HOSTINGER_USER|HOSTINGER_PATH)=' .deploy.env > .env
          rm .deploy.env

      - name: Setup SSH
        run: |
          echo "Host: '$HOSTINGER_HOST'  Port: '$HOSTINGER_PORT'  User: '$HOSTINGER_USER'"

          mkdir -p ~/.ssh
          echo "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/hostinger_key
          chmod 600 ~/.ssh/hostinger_key

          echo "Testing raw TCP connectivity to $HOSTINGER_HOST:$HOSTINGER_PORT ..."
          timeout 10 bash -c "cat < /dev/null > /dev/tcp/$HOSTINGER_HOST/$HOSTINGER_PORT" \
            && echo "TCP connect: OK" \
            || echo "TCP connect: FAILED (exit $?)"

          ssh-keyscan -p "$HOSTINGER_PORT" "$HOSTINGER_HOST" >> ~/.ssh/known_hosts \
            || echo "ssh-keyscan FAILED (exit $?) — continuing anyway"

      - name: Deploy via rsync/SSH
        run: |
          rsync -rlgoDzvc --delete \
            --exclude ".git/" \
            --exclude ".github/" \
            --exclude ".claude/" \
            --exclude ".vscode/" \
            --exclude "backend/logs/" \
            --exclude "backend/data/*.json" \
            --exclude ".env.example" \
            --exclude ".gitignore" \
            --exclude ".dockerignore" \
            --exclude "Dockerfile" \
            --exclude "docker-compose.yml" \
            --exclude "*.md" \
            --exclude "new_schema.sql" \
            --exclude "backend/schema.sql" \
            --exclude "backend/kwikar.sql" \
            --exclude "admin/backend/seed_admin.php" \
            -e "ssh -i ~/.ssh/hostinger_key -p $HOSTINGER_PORT" \
            ./ "$HOSTINGER_USER@$HOSTINGER_HOST:$HOSTINGER_PATH"
